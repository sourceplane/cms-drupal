apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Drupal marketing site (Next.js Pages Router on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment; R2 as the Next.js cache, refreshed on demand by Drupal; sample content until a Drupal site is connected)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # INFRA BEFORE APP. The R2 bucket is the Worker's incremental cache, bound
  # by name, and the name is rendered into its config during the build from
  # the wiring document the cloudflare-r2 root lease-publishes after its
  # apply. A job resolves its secrets when it STARTS, so on a merge to main
  # this deploy waits for that environment's apply (enforced) and the document
  # is there; a pull request deploys nothing, so nothing on one waits
  # (advisory).
  dependsOn:
    - component: cloudflare-r2
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  secretEnv:
    WIRING_CLOUDFLARE_R2_STAGE: "secret://cms-drupal/cms-drupal/stage/WIRING_CLOUDFLARE_R2"
    WIRING_CLOUDFLARE_R2_PROD: "secret://cms-drupal/cms-drupal/prod/WIRING_CLOUDFLARE_R2"
  # The Drupal site, connected after the build by its owner, per environment:
  # its URL (DRUPAL_BASE_URL) and, for the template's multi-site Drupal, the
  # site id. The build inlines both (next.config.ts `env`) and pre-renders
  # every page Drupal lists, so connecting Drupal is a redeploy; without a URL
  # — every fresh product — the site renders its bundled sample content
  # (lib/sample-drupal.mjs). DRUPAL_CLIENT_ID / DRUPAL_CLIENT_SECRET (the
  # OAuth client preview reads drafts with) and DRUPAL_REVALIDATE_SECRET (the
  # `?secret=` /api/revalidate checks) never reach the build: the deploy hands
  # them to the Worker as secrets (buildCommand below; the README's
  # "Connecting Drupal").
  optionalSecretEnv:
    DRUPAL_BASE_URL: "secret://cms-drupal/cms-drupal/{{ .environment }}/DRUPAL_BASE_URL"
    DRUPAL_SITE_ID: "secret://cms-drupal/cms-drupal/{{ .environment }}/DRUPAL_SITE_ID"
    DRUPAL_CLIENT_ID: "secret://cms-drupal/cms-drupal/{{ .environment }}/DRUPAL_CLIENT_ID"
    DRUPAL_CLIENT_SECRET: "secret://cms-drupal/cms-drupal/{{ .environment }}/DRUPAL_CLIENT_SECRET"
    DRUPAL_REVALIDATE_SECRET: "secret://cms-drupal/cms-drupal/{{ .environment }}/DRUPAL_REVALIDATE_SECRET"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: cms-drupal-web-{dev,stage,prod}. The rendered
    # wrangler.jsonc names the same Worker (its self-reference binding needs it).
    workerName: cms-drupal-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config, then build. stage and prod
    # render from the wiring document their cloudflare-r2 apply published
    # (secretEnv above, resolved before the job's first step); dev, which no
    # root applies to and which only verifies, renders from the committed
    # fixture. The committed wrangler.jsonc (the fixture render) is what the
    # composition's verify-app-structure step finds before this runs. The
    # build is for this environment's origin: NEXT_PUBLIC_SITE_URL (the
    # canonical and Open Graph links' origin) is the environment's SITE_URL
    # (intent.yaml), else its workers.dev URL.
    # The OAuth client and the revalidation secret never reach the build
    # (`env -u`), so no bundle carries them; on a deploy lane they then go to
    # the Worker as SECRETS (tooling/wire/worker-secrets.mjs: `wrangler secret
    # bulk` over stdin; a verify lane holds no Cloudflare credential and
    # pushes nothing).
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-r2 --env "${ORUN_ENVIRONMENT}" --fixture wiring.fixture.json --fixture-envs dev && NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://cms-drupal-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" env -u DRUPAL_CLIENT_ID -u DRUPAL_CLIENT_SECRET -u DRUPAL_REVALIDATE_SECRET pnpm exec turbo run build --filter=@app/web && node ../../tooling/wire/worker-secrets.mjs --secret DRUPAL_CLIENT_ID --secret DRUPAL_CLIENT_SECRET --secret DRUPAL_REVALIDATE_SECRET --worker "cms-drupal-web-${ORUN_ENVIRONMENT}" --config wrangler.jsonc

    # Smoke: the home page renders the site's menu (from the sample Drupal
    # before one is connected, from Drupal after); the Worker itself answers
    # /api/health, which no static file can; and /api/revalidate refuses a
    # call without the secret (401), whether or not one is set. Read-only: it
    # revalidates nothing. Not the site's name: that is the owner's to change,
    # and HTML-escaped when it carries an `&` or `'`. Each response is
    # buffered before grep so an early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'data-cy=\"navbar-menu\"' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true' && test \"$(curl -s -o /dev/null -w '%{http_code}' \"${DEPLOYED_URL}/api/revalidate?path=/\")\" = 401"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
